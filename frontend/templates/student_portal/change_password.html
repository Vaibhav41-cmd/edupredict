<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#4f46e5,#7c3aed);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
    .card{max-width:450px;width:100%;border:none;border-radius:12px}
  </style>
</head>
<body>
  <div class="card p-4">
    <h5 class="fw-bold mb-3"><i class="bi bi-key"></i> Change Password</h5>
    <p class="text-muted small">{{ student.name }} ({{ student.student_id }})</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for c,m in messages %}<div class="alert alert-{{ c }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label class="form-label small">Current Password</label>
        <input type="password" class="form-control" name="current_password" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">New Password (min 6 chars)</label>
        <input type="password" class="form-control" name="new_password" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label small">Confirm New Password</label>
        <input type="password" class="form-control" name="confirm_password" required>
      </div>
      <button type="submit" class="btn w-100" style="background:#4f46e5;color:#fff;font-weight:600;">Update Password</button>
      <a href="{{ url_for('student_portal.dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">← Back</a>
    </form>
  </div>
</body>
</html>
