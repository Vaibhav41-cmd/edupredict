<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#4f46e5,#7c3aed);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
    .card{border:none;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:420px;width:100%}
    .header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:2rem;text-align:center;color:#fff}
    .header .icon{font-size:3rem;margin-bottom:.5rem}
    .body{padding:2rem;background:#fff;color:#1e293b}
    .form-control{border-radius:8px;padding:10px 14px}
    .form-control:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    a{color:#4f46e5}
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">👨‍🎓</div>
      <h3 class="fw-bold mb-1">Student Portal</h3>
      <p class="mb-0 opacity-75">View your predictions & marks</p>
    </div>
    <div class="body">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for c,m in messages %}<div class="alert alert-{{ c }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">Username (Student ID)</label>
          <input type="text" class="form-control" name="username" placeholder="e.g., MCA2024001" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small text-muted">Password</label>
          <input type="password" class="form-control" name="password" placeholder="Default: your Student ID" required>
        </div>
        <button type="submit" class="btn w-100" style="background:#4f46e5;color:#fff;padding:10px;border-radius:8px;font-weight:600;">Sign In</button>
      </form>
      <hr>
      <div class="text-center small"><a href="{{ url_for('auth.login') }}">← Admin Login</a></div>
    </div>
  </div>
</body>
</html>
