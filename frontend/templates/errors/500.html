{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div class="empty-state" style="padding:80px 20px">
  <div style="font-size:5rem;font-weight:800;color:#fee2e2;line-height:1">500</div>
  <i class="bi bi-exclamation-triangle" style="font-size:2.5rem;opacity:.3;color:#ef4444;margin:12px 0"></i>
  <h5 class="fw-600 mt-3">Internal Server Error</h5>
  <p class="text-muted">Something went wrong on our end. Check the application logs.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">
    <i class="bi bi-house-fill me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
